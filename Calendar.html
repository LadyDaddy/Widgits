<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --accent: #ff2d9b;
    --text: #f0f0f0;
    --muted: #555;
    --border: #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }

  .date-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 15px 12px;
    width: 100%;
    max-width: 280px;
    position: relative;
    overflow: hidden;
  }

  .date-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 12px 12px 0 0;
  }

  .label {
    font-size: 6px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .content-row {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .left {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 70px;
  }

  .day-number {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .day-number span {
    color: var(--accent);
  }

  .left-meta {
    margin-top: 8px;
  }

  .weekday {
    font-size: 6px;
    color: var(--text);
    letter-spacing: 0.05em;
    font-weight: 600;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  .month-badge {
    font-size: 6px;
    letter-spacing: 0.12em;
    color: #fff;
    background: var(--accent);
    padding: 2px 5px;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    display: inline-block;
  }

  .vdivider {
    width: 1px;
    background: var(--border);
    align-self: stretch;
    flex-shrink: 0;
  }

  .calendar {
    flex: 1;
  }

  .cal-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 3px;
  }

  .cal-header span {
    font-size: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-align: center;
    padding: 1px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6px;
    font-weight: 600;
    color: var(--text);
    border-radius: 3px;
  }

  .cal-day.empty {
    visibility: hidden;
  }

  .cal-day.today {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="date-card">
  <div class="label">Today's Date</div>
  <div class="content-row">
    <div class="left">
      <div class="day-number" id="day-number">--</div>
      <div class="left-meta">
        <span class="weekday" id="weekday">---</span>
        <span class="month-badge" id="month-year">--- ----</span>
      </div>
    </div>
    <div class="vdivider"></div>
    <div class="calendar">
      <div class="cal-header">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<script>
  function updateDate() {
    const now = new Date();
    const pst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const today = pst.getDate();
    const monthIndex = pst.getMonth();
    const year = pst.getFullYear();

    const dayStr = String(today);
    document.getElementById('day-number').innerHTML = dayStr.length > 1
      ? dayStr.slice(0, -1) + `<span>${dayStr.slice(-1)}</span>`
      : `<span>${dayStr}</span>`;

    document.getElementById('weekday').textContent = days[pst.getDay()];
    document.getElementById('month-year').textContent = `${months[monthIndex]} ${year}`;

    const firstDay = new Date(year, monthIndex, 1).getDay();
    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement('div');
      el.className = 'cal-day' + (d === today ? ' today' : '');
      el.textContent = d;
      grid.appendChild(el);
    }
  }

  updateDate();
  setInterval(updateDate, 60000);
</script>
</body>
</html>
